# Prioritet static website; included only in its dedicated virtual hosts.
root /var/www/prioritet/current;
index index.html;
server_tokens off;
etag on;
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json application/xml image/svg+xml;
add_header X-Content-Type-Options nosniff always;
error_page 404 /404.html;

location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
}
location ~ (^|/)\. {
    return 404;
}
location ^~ /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
location /assets/fonts/ {
    try_files $uri =404;
    types { font/woff2 woff2; font/ttf ttf; }
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
}
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
}
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
